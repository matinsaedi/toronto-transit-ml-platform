services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc_dev
      POSTGRES_DB: ttc_ml
    ports:
      - "5432:5432"
    volumes:
      - ttc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc -d ttc_ml"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

volumes:
  ttc-postgres-data:
    external: true
  prometheus-data:
