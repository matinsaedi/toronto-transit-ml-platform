[project]
name = "toronto-transit-ml-platform"
version = "0.1.0"
description = "An end-to-end ML platform for Toronto TTC delay prediction"
requires-python = ">= 3.12"
dependencies = [
		"pandas",
                "requests",
                "scikit-learn",
                "xgboost",
                "joblib",
                "fastapi",
                "uvicorn",
                "psycopg[binary]",
		]

[project.optional-dependencies]
dev = [
       "jupyter",
       "pytest",
       "httpx",
      ]

